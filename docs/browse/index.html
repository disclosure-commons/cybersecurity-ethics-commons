<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse cases &middot; Disclosure Commons</title>
<meta name="description" content="Filter and search the full Disclosure Commons case library by category, actor type, and chilling effect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* ============ Browse-app-specific layout (not shared across other pages) ============ */
  .layout{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:260px 1fr;
    gap:0;
    align-items:start;
  }
  @media (max-width:860px){ .layout{grid-template-columns:1fr;} }

  .sidebar{
    padding:1.75rem 1.5rem 3rem 2rem;
    border-right:1px solid var(--rule);
    position:sticky;
    top:0;
    max-height:100vh;
    overflow-y:auto;
  }
  @media (max-width:860px){
    .sidebar{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--rule);padding:1.5rem 2rem;}
  }

  .search-box{
    display:flex;align-items:center;gap:0.5rem;
    border:1px solid var(--ink);background:var(--paper-raised);
    padding:0.55rem 0.7rem;margin-bottom:1.6rem;
  }
  .search-box input{border:none;background:none;outline:none;font-family:var(--sans);font-size:0.92rem;color:var(--ink);width:100%;}
  .search-box svg{flex-shrink:0;opacity:0.6;}

  .filter-group{margin-bottom:1.7rem;}
  .filter-group h2{
    font-family:var(--mono);font-size:0.68rem;font-weight:600;letter-spacing:0.04em;
    color:var(--ink-soft);margin:0 0 0.6rem;text-transform:uppercase;
  }
  .filter-list{list-style:none;margin:0;padding:0;}
  .filter-item{
    display:flex;align-items:center;gap:0.55rem;width:100%;text-align:left;
    background:none;border:none;font-family:var(--sans);font-size:0.87rem;color:var(--ink);
    padding:0.32rem 0;cursor:pointer;opacity:0.72;
  }
  .filter-item:hover{opacity:1;}
  .filter-item.active{opacity:1;font-weight:600;}
  .filter-swatch{width:10px;height:10px;flex-shrink:0;border:1px solid rgba(0,0,0,0.25);}
  .filter-count{margin-left:auto;font-family:var(--mono);font-size:0.74rem;color:var(--ink-soft);}

  .chip-row{display:flex;flex-wrap:wrap;gap:0.4rem;}
  .chip{
    font-family:var(--mono);font-size:0.72rem;padding:0.28rem 0.55rem;
    border:1px solid var(--rule);background:var(--paper-raised);cursor:pointer;color:var(--ink-soft);
  }
  .chip.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}

  .reset-btn{font-family:var(--mono);font-size:0.76rem;text-decoration:underline;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:0;}

  .main{padding:1.75rem 2rem 4rem;}
  .result-bar{font-family:var(--mono);font-size:0.78rem;color:var(--ink-soft);margin-bottom:1.1rem;padding-bottom:0.9rem;border-bottom:1px solid var(--rule-soft);}

  .case-row{display:grid;grid-template-columns:64px 1fr;gap:1.1rem;padding:1.05rem 0;border-bottom:1px solid var(--rule-soft);cursor:pointer;}
  .case-row:hover .case-title{text-decoration:underline;}
  .case-row .case-num{font-family:var(--mono);font-size:0.78rem;color:var(--ink-soft);padding-top:0.15rem;}
  .case-body{border-left:3px solid var(--cat-color, var(--rule));padding-left:0.9rem;}
  .case-meta-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:0.5rem;margin-bottom:0.3rem;font-family:var(--mono);font-size:0.74rem;color:var(--ink-soft);}
  .case-meta-line .cat-label{color:var(--cat-color,var(--ink-soft));font-weight:600;}
  .case-title{font-family:var(--serif);font-weight:600;font-size:1.12rem;margin:0 0 0.28rem;}
  .case-summary{font-size:0.92rem;color:var(--ink-soft);margin:0;max-width:74ch;}
  .flag-chilling{display:inline-block;font-family:var(--mono);font-size:0.68rem;color:var(--flag-red);border:1px solid var(--flag-red);padding:0.05rem 0.4rem;margin-left:0.3rem;}

  .empty-state{padding:3rem 0;font-family:var(--serif);font-style:italic;color:var(--ink-soft);}

  .overlay-scrim{position:fixed;inset:0;background:rgba(28,35,33,0.45);display:none;z-index:50;}
  .overlay-scrim.open{display:block;}
  .overlay-panel{
    position:fixed;top:0;right:0;bottom:0;width:min(560px, 100%);
    background:var(--paper-raised);border-left:2px solid var(--ink);
    transform:translateX(100%);transition:transform 0.28s ease;z-index:51;
    overflow-y:auto;padding:2rem 2rem 3rem;
  }
  .overlay-panel.open{transform:translateX(0);}
  @media (prefers-reduced-motion: reduce){ .overlay-panel{transition:none;} }
  .overlay-close{font-family:var(--mono);font-size:0.8rem;background:none;border:1px solid var(--ink);padding:0.35rem 0.7rem;cursor:pointer;color:var(--ink);margin-bottom:1.6rem;}
  .overlay-num{font-family:var(--mono);font-size:0.8rem;color:var(--ink-soft);}
  .overlay-panel h2{font-family:var(--serif);font-size:1.55rem;margin:0.3rem 0 0.2rem;line-height:1.2;}
  .overlay-cat{display:inline-block;font-family:var(--mono);font-size:0.76rem;font-weight:600;margin-bottom:1.3rem;color:var(--cat-color,var(--ink));}
  .overlay-summary{font-size:0.98rem;margin-bottom:1.5rem;}
  .overlay-permalink{font-family:var(--mono);font-size:0.78rem;text-decoration:underline;display:inline-block;margin-bottom:1.2rem;}
</style>
</head>
<body>

<nav class="sitenav"><div class="sitenav-inner">
  <a class="sitenav-brand" href="../">Disclosure Commons</a>
  <div class="sitenav-links">
    <a href="../">Home</a>
    <a class="active" href="./">Browse</a>
    <a href="../taxonomy/">Taxonomy</a>
    <a href="../about/">About</a>
    <a href="../contribute/">Contribute</a>
    <a href="../articles/">Further reading</a>
    <a href="../cite/">Cite this</a>
  </div>
</div></nav>

<div class="layout">
  <aside class="sidebar">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Search institution, summary, dilemma&hellip;">
    </div>
    <div class="filter-group"><h2>Category</h2><ul class="filter-list" id="category-filters"></ul></div>
    <div class="filter-group"><h2>Actor type</h2><div class="chip-row" id="actor-filters"></div></div>
    <div class="filter-group">
      <h2>Chilling effect</h2>
      <div class="chip-row" id="chilling-filters">
        <button class="chip" data-val="any">Any</button>
        <button class="chip" data-val="Yes">Flagged</button>
        <button class="chip" data-val="No">Not flagged</button>
      </div>
    </div>
    <button class="reset-btn" id="reset-btn">Clear all filters</button>
  </aside>

  <main class="main">
    <div class="result-bar" id="result-bar">Loading cases&hellip;</div>
    <div id="case-list"></div>
  </main>
</div>

<div class="overlay-scrim" id="scrim"></div>
<div class="overlay-panel" id="overlay-panel"></div>

<footer class="sitefooter"><div class="sitefooter-inner">
  <span>Disclosure Commons &middot; cybersecurity ethics case library</span>
  <span><a href="../cite/">Cite this dataset</a> &middot; <a href="https://github.com/disclosure-commons/cybersecurity-ethics-commons" target="_blank" rel="noopener">GitHub</a> &middot; <a href="../contribute/">Report a correction</a></span>
</div></footer>

<script>
const CAT_COLORS = {
  'Vulnerability Disclosure': 'var(--c-vuln)',
  'Informed Consent & Human Subjects': 'var(--c-consent)',
  'Dual-Use Research': 'var(--c-dual)',
  'Legal Boundaries & CFAA Overreach': 'var(--c-legal)',
  'Institutional Suppression': 'var(--c-suppress)',
  'Financial Conflict of Interest': 'var(--c-financial)',
  'Critical Infrastructure & Public Trust': 'var(--c-infra)',
  'Surveillance & Offensive Tools': 'var(--c-surveil)'
};

let CASES = [];
let CATEGORIES = [];
let state = { search:'', categories:new Set(), actorTypes:new Set(), chilling:'any' };

fetch('../assets/cases.json')
  .then(r => r.json())
  .then(d => { CASES = d.cases; CATEGORIES = d.categories; renderAll(); })
  .catch(() => { document.getElementById('result-bar').textContent = 'Could not load case data.'; });

function countBy(key){ const m={}; CASES.forEach(c=>{m[c[key]]=(m[c[key]]||0)+1;}); return m; }

function renderCategoryFilters(){
  const counts = countBy('category');
  const ul = document.getElementById('category-filters');
  ul.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const li = document.createElement('li');
    li.className = 'filter-item' + (state.categories.has(cat.name) ? ' active' : '');
    li.innerHTML = `<span class="filter-swatch" style="background:${CAT_COLORS[cat.name]||'#999'}"></span>
      <span>${cat.name}</span><span class="filter-count">${counts[cat.name]||0}</span>`;
    li.title = cat.description;
    li.onclick = () => { state.categories.has(cat.name) ? state.categories.delete(cat.name) : state.categories.add(cat.name); renderAll(); };
    ul.appendChild(li);
  });
}

function renderActorFilters(){
  const counts = countBy('actor_type');
  const wrap = document.getElementById('actor-filters');
  wrap.innerHTML = '';
  Object.keys(counts).sort().forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.actorTypes.has(type) ? ' active' : '');
    btn.textContent = `${type} (${counts[type]})`;
    btn.onclick = () => { state.actorTypes.has(type) ? state.actorTypes.delete(type) : state.actorTypes.add(type); renderAll(); };
    wrap.appendChild(btn);
  });
}

function renderChillingFilters(){
  document.querySelectorAll('#chilling-filters .chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.val === state.chilling);
    chip.onclick = () => { state.chilling = chip.dataset.val; renderAll(); };
  });
}

function matches(c){
  if(state.categories.size && !state.categories.has(c.category)) return false;
  if(state.actorTypes.size && !state.actorTypes.has(c.actor_type)) return false;
  if(state.chilling !== 'any' && c.chilling !== state.chilling) return false;
  if(state.search){
    const q = state.search.toLowerCase();
    const hay = (c.institution+' '+c.summary+' '+c.dilemmas+' '+c.category).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderList(){
  const filtered = CASES.filter(matches);
  document.getElementById('result-bar').textContent = `${filtered.length} of ${CASES.length} cases`;
  const list = document.getElementById('case-list');
  if(!filtered.length){ list.innerHTML = '<div class="empty-state">No cases match these filters. Try clearing one.</div>'; return; }
  list.innerHTML = filtered.map(c => `
    <div class="case-row" data-id="${c.id}">
      <div class="case-num">No.${String(c.id).padStart(3,'0')}</div>
      <div class="case-body" style="--cat-color:${CAT_COLORS[c.category]||'#999'}">
        <div class="case-meta-line">
          <span class="cat-label">${c.category}</span><span>&middot; ${c.year}</span><span>&middot; ${c.actor_type}</span>
          ${c.chilling === 'Yes' ? '<span class="flag-chilling">chilling effect</span>' : ''}
        </div>
        <h3 class="case-title">${c.institution}</h3>
        <p class="case-summary">${c.summary}</p>
      </div>
    </div>`).join('');
  list.querySelectorAll('.case-row').forEach(row => { row.onclick = () => openCase(parseInt(row.dataset.id)); });
}

function openCase(id){
  const c = CASES.find(x => x.id === id);
  if(!c) return;
  const panel = document.getElementById('overlay-panel');
  panel.style.setProperty('--cat-color', CAT_COLORS[c.category]||'#999');
  const permalink = `../cases/${String(c.id).padStart(3,'0')}/`;
  panel.innerHTML = `
    <button class="overlay-close" id="overlay-close-btn">Close</button>
    <div class="overlay-num">Case No.${String(c.id).padStart(3,'0')}</div>
    <h2>${c.institution}</h2>
    <div class="overlay-cat" style="color:${CAT_COLORS[c.category]||'#999'}">${c.category} &middot; ${c.year}</div>
    ${c.chilling === 'Yes' ? '<div class="stamp">Chilling effect</div>' : ''}
    <p class="overlay-summary">${c.summary}</p>
    <div class="meta-grid">
      <div class="meta-field"><label>Actor type</label><div>${c.actor_type || '&mdash;'}</div></div>
      <div class="meta-field"><label>Actor intent</label><div>${c.intent || '&mdash;'}</div></div>
      <div class="meta-field"><label>Disclosure method</label><div>${c.disclosure || '&mdash;'}</div></div>
      <div class="meta-field"><label>Legal outcome</label><div>${c.outcome || '&mdash;'}</div></div>
    </div>
    <h3>Key ethical dilemmas</h3><p>${c.dilemmas || '&mdash;'}</p>
    ${c.source ? `<h3>Source</h3><p><a href="${c.source}" target="_blank" rel="noopener">${c.source}</a></p>` : ''}
    <a class="overlay-permalink" href="${permalink}">View this case's permanent page &rarr;</a>
  `;
  document.getElementById('overlay-close-btn').onclick = closeCase;
  panel.classList.add('open');
  document.getElementById('scrim').classList.add('open');
}

function closeCase(){
  document.getElementById('overlay-panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
document.getElementById('scrim').onclick = closeCase;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeCase(); });
document.getElementById('search-input').addEventListener('input', e => { state.search = e.target.value; renderList(); });
document.getElementById('reset-btn').onclick = () => {
  state = { search:'', categories:new Set(), actorTypes:new Set(), chilling:'any' };
  document.getElementById('search-input').value = '';
  renderAll();
};

function renderAll(){ renderCategoryFilters(); renderActorFilters(); renderChillingFilters(); renderList(); }
</script>
</body>
</html>
